# Statički sajt ostaje u korijenu. Termini i admin prijava su Netlify funkcije.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Stara adresa admin.html vodi na zasebnu admin stranicu.
[[redirects]]
  from = "/admin.html"
  to = "/admin/"
  status = 301
